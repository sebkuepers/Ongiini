# experimental.ongiini.ai while no model is live (deploy/experimental/go_down.sh):
# one static page, the chat API answers 503 so an open tab fails cleanly.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    location ^~ /v1/ { return 503; }
    location / { try_files /index.html =404; }
}
