# experimental.ongiini.ai: the chat page (built by scripts/build_experimental_chat.py)
# and the experimental backend's chat API on the same origin. Only the chat routes
# are exposed — no WhatsApp webhook, learn or rate surface.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;   # image uploads, as on api.ongiini.ai
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { try_files /index.html =404; }

    location ~ ^/v1/chat(/clear)?$ {
        proxy_pass http://ongiini-experimental:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }

    location / { return 404; }
}
