services:
  webhook:
    build: ./webhook
    container_name: ongiini-webhook
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8445:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  website:
    image: nginx:1.27-alpine
    container_name: ongiini-website
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:18789:80"
