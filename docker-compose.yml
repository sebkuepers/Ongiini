services:
  webhook:
    build: ./webhook
    container_name: ongiini-webhook
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  website:
    image: nginx:1.27-alpine
    container_name: ongiini-website
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    container_name: ongiini-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webhook
      - website
