services:
  webhook:
    # Build context is the repo root so the Dockerfile can copy both
    # the ``ongiini`` application and the ``owela`` framework, which
    # live at the top level as sibling packages.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ongiini-webhook
    restart: unless-stopped
    env_file: .env
    environment:
      # mem0 wants to mkdir ~/.mem0 on import for its config + history db.
      # The non-root ongiini user has no home dir on a read-only rootfs,
      # so point mem0 at the writable bind-mounted /data volume instead.
      MEM0_DIR: /data/mem0
      # Don't phone home to PostHog — matches our "no US cloud, no
      # third-party data sharing" privacy stance. Also avoids an
      # extra outbound call per request.
      MEM0_TELEMETRY: "False"
      # sentence-transformers (mem0's embedder) writes lockfiles whenever
      # it loads a model. The image pre-downloads the model into
      # /app/.hf_cache but that path is read-only at runtime. Point the
      # cache at /data (writable bind mount) — first container start
      # re-downloads the ~80MB model, every restart after that finds it
      # cached.
      HF_HOME: /data/hf_cache
      SENTENCE_TRANSFORMERS_HOME: /data/hf_cache/sentence_transformers
    # Match the Dockerfile's `ongiini` user (UID/GID 1000), which lines up
    # with the host's `nexus` user that owns ./data. Files written via the
    # bind mount stay owned by nexus instead of root.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # uvicorn / starlette occasionally need a writable /tmp for spooled
      # multipart bodies; httpx connection pool also benefits from it.
      - /tmp:size=64M,mode=1777
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8445:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  website:
    image: nginx:1.27-alpine
    container_name: ongiini-website
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website-config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18789:80"
