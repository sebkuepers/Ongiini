# Site config for the Ongiini static website container.
# Override nginx:alpine's /etc/nginx/conf.d/default.conf.

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  application/rss+xml
  application/atom+xml
  application/vnd.ms-fontobject
  image/svg+xml
  font/ttf
  font/otf;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Don't leak nginx version.
  server_tokens off;

  # Aggressively cache versioned-ish assets. The PNG icons rarely change;
  # if they do we'll rename them or bump a query string at deploy time.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # HTML never caches — the build is small and we want fast propagation.
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 = /index.html;
}
